name: Windows build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  windows:
    # "nogdal" is a smaller package without GDAL and the ~150 DLLs it
    # pulls in from MSYS2, for telling whether a startup failure on a
    # user's PC comes from one of those libraries.
    strategy:
      fail-fast: false
      matrix:
        variant: [full, nogdal]
    runs-on: windows-latest
    env:
      PACKAGE: Mapper-windows-x64${{ matrix.variant == 'nogdal' && '-nogdal' || '' }}
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            zip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt5
            mingw-w64-x86_64-proj
            ${{ matrix.variant == 'full' && 'mingw-w64-x86_64-gdal' || '' }}

      - name: Configure
        run: |
          cmake -G Ninja -S "${GITHUB_WORKSPACE}" -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DMapper_MANUAL=OFF \
            -DMapper_PACKAGE_ASSISTANT=OFF \
            -DMapper_PACKAGE_QT=OFF \
            -DMapper_PACKAGE_PROJ=OFF \
            -DMapper_PACKAGE_GDAL=OFF \
            -DMapper_USE_GDAL=${{ matrix.variant == 'full' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build

      - name: Package portable build
        run: |
          set -e
          DIST="dist/Mapper"
          # Mapper.exe plus its data next to it (translations, symbol sets,
          # examples, licenses), where Mapper looks for them on Windows.
          # (The install scripts need an absolute Windows path.)
          cmake --install build --prefix "$(cygpath -m "$PWD/$DIST")"

          # Qt plugins are not auto-collected (no windeployqt in MSYS2);
          # copy the ones Mapper needs to find a platform and load images/SQL.
          QT_PLUGINS="/mingw64/share/qt5/plugins"
          for sub in platforms imageformats iconengines styles platformthemes printsupport sqldrivers tls generic; do
            if [ -d "$QT_PLUGINS/$sub" ]; then
              mkdir -p "$DIST/$sub"
              cp -r "$QT_PLUGINS/$sub"/*.dll "$DIST/$sub/" 2>/dev/null || true
            fi
          done
          printf '[Paths]\nPlugins = .\n' > "$DIST/qt.conf"

          # Bundle the MinGW runtime DLLs (Qt, PROJ, GDAL, libgcc, etc.)
          # that the executable and its plugins depend on.
          collected=1
          while [ "$collected" -ne 0 ]; do
            collected=0
            for f in $(find "$DIST" -name '*.exe' -o -name '*.dll'); do
              [ -e "$f" ] || continue
              for dll in $(ldd "$f" 2>/dev/null | awk '{print $3}' | grep -i '/mingw64/'); do
                base=$(basename "$dll")
                if [ ! -e "$DIST/$base" ]; then
                  cp "$dll" "$DIST/"
                  collected=1
                fi
              done
            done
          done

          # Qt's own translations (standard dialogs and buttons), loaded as
          # translations/qt_<lang>.qm for every language Mapper ships.
          # Keep the qt_*.qm files which Mapper provides itself.
          QT_TRANSLATIONS="/mingw64/share/qt5/translations"
          for f in "$DIST"/translations/OpenOrienteering_*.qm; do
            lang=$(basename "$f" .qm)
            lang=${lang#OpenOrienteering_}
            target="$DIST/translations/qt_$lang.qm"
            [ -e "$target" ] && continue
            for source in "$QT_TRANSLATIONS/qtbase_$lang.qm" "$QT_TRANSLATIONS/qtbase_${lang%%_*}.qm"; do
              if [ -f "$source" ]; then
                cp "$source" "$target"
                break
              fi
            done
          done

          # PROJ and GDAL data: Mapper looks for them in "proj" and "gdal"
          # next to the executable (data:/proj, data:/gdal).
          mkdir -p "$DIST/proj"
          cp -r /mingw64/share/proj/. "$DIST/proj/"
          if [ "${{ matrix.variant }}" = full ]; then
            mkdir -p "$DIST/gdal"
            cp -r /mingw64/share/gdal/. "$DIST/gdal/"
          fi
          test -f "$DIST/proj/proj.db"
          test -f "$DIST/Mapper.exe"
          test -f "$DIST/translations/OpenOrienteering_ru.qm"
          test -f "$DIST/translations/qt_ru.qm"

          cd dist && zip -r "../${{ env.PACKAGE }}.zip" Mapper

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.zip
          retention-days: 30

      # Start Mapper from the unpacked ZIP the way it runs on a user's PC:
      # only Windows' own directories in PATH, so a DLL missing from the
      # package is not found in MSYS2 or among the runner's tools.
      # Runs after the upload so that a failing package can be inspected.
      - name: Smoke test (start with a clean PATH)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'mapper-smoke'
          Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
          Expand-Archive -Path "$($env:PACKAGE).zip" -DestinationPath $dir
          $exe = Join-Path $dir 'Mapper\Mapper.exe'

          # Without this, Windows shows a message box for a DLL which is
          # missing (0xc0000135) or fails to initialize (0xc0000142), and
          # the process does not exit. The error mode is inherited.
          Add-Type -Namespace Win32 -Name ErrorMode -MemberDefinition '[DllImport("kernel32.dll")] public static extern uint SetErrorMode(uint mode);'
          [Win32.ErrorMode]::SetErrorMode(0x0003) | Out-Null  # SEM_FAILCRITICALERRORS | SEM_NOGPFAULTERRORBOX

          $psi = [System.Diagnostics.ProcessStartInfo]::new($exe)
          $psi.UseShellExecute = $false
          $psi.WorkingDirectory = Split-Path $exe
          $psi.Environment['PATH'] = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          $p = [System.Diagnostics.Process]::Start($psi)

          # Mapper has started when its main window is shown.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline) {
            if ($p.HasExited) {
              Write-Host ('::error::Mapper.exe exited during startup with code 0x{0:X8}' -f $p.ExitCode)
              exit 1
            }
            $p.Refresh()
            if ($p.MainWindowHandle -ne [IntPtr]::Zero) {
              Write-Host "Mapper.exe started: '$($p.MainWindowTitle)'"
              $p.Kill()
              exit 0
            }
            Start-Sleep -Milliseconds 500
          }
          $p.Kill()
          Write-Host '::error::Mapper.exe did not show a window within 60 seconds'
          exit 1
