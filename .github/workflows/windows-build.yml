name: Windows build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            zip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt5
            mingw-w64-x86_64-proj
            mingw-w64-x86_64-gdal

      - name: Configure
        run: |
          cmake -G Ninja -S "${GITHUB_WORKSPACE}" -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DMapper_MANUAL=OFF \
            -DMapper_PACKAGE_ASSISTANT=OFF \
            -DMapper_PACKAGE_QT=OFF \
            -DMapper_PACKAGE_PROJ=OFF \
            -DMapper_PACKAGE_GDAL=OFF

      - name: Build
        run: cmake --build build

      - name: Package portable build
        run: |
          set -e
          DIST="dist/Mapper"
          # Mapper.exe plus its data next to it (translations, symbol sets,
          # examples, licenses), where Mapper looks for them on Windows.
          # (The install scripts need an absolute Windows path.)
          cmake --install build --prefix "$(cygpath -m "$PWD/$DIST")"

          # Qt plugins are not auto-collected (no windeployqt in MSYS2);
          # copy the ones Mapper needs to find a platform and load images/SQL.
          QT_PLUGINS="/mingw64/share/qt5/plugins"
          for sub in platforms imageformats iconengines styles platformthemes printsupport sqldrivers tls generic; do
            if [ -d "$QT_PLUGINS/$sub" ]; then
              mkdir -p "$DIST/$sub"
              cp -r "$QT_PLUGINS/$sub"/*.dll "$DIST/$sub/" 2>/dev/null || true
            fi
          done
          printf '[Paths]\nPlugins = .\n' > "$DIST/qt.conf"

          # Bundle the MinGW runtime DLLs (Qt, PROJ, GDAL, libgcc, etc.)
          # that the executable and its plugins depend on.
          collected=1
          while [ "$collected" -ne 0 ]; do
            collected=0
            for f in $(find "$DIST" -name '*.exe' -o -name '*.dll'); do
              [ -e "$f" ] || continue
              for dll in $(ldd "$f" 2>/dev/null | awk '{print $3}' | grep -i '/mingw64/'); do
                base=$(basename "$dll")
                if [ ! -e "$DIST/$base" ]; then
                  cp "$dll" "$DIST/"
                  collected=1
                fi
              done
            done
          done

          # Qt's own translations (standard dialogs and buttons), loaded as
          # translations/qt_<lang>.qm for every language Mapper ships.
          # Keep the qt_*.qm files which Mapper provides itself.
          QT_TRANSLATIONS="/mingw64/share/qt5/translations"
          for f in "$DIST"/translations/OpenOrienteering_*.qm; do
            lang=$(basename "$f" .qm)
            lang=${lang#OpenOrienteering_}
            target="$DIST/translations/qt_$lang.qm"
            [ -e "$target" ] && continue
            for source in "$QT_TRANSLATIONS/qtbase_$lang.qm" "$QT_TRANSLATIONS/qtbase_${lang%%_*}.qm"; do
              if [ -f "$source" ]; then
                cp "$source" "$target"
                break
              fi
            done
          done

          # PROJ and GDAL data: Mapper looks for them in "proj" and "gdal"
          # next to the executable (data:/proj, data:/gdal).
          mkdir -p "$DIST/proj" "$DIST/gdal"
          cp -r /mingw64/share/proj/. "$DIST/proj/"
          cp -r /mingw64/share/gdal/. "$DIST/gdal/"
          test -f "$DIST/proj/proj.db"
          test -f "$DIST/Mapper.exe"
          test -f "$DIST/translations/OpenOrienteering_ru.qm"
          test -f "$DIST/translations/qt_ru.qm"

          cd dist && zip -r "../Mapper-windows-x64.zip" Mapper

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mapper-windows-x64
          path: Mapper-windows-x64.zip
          retention-days: 30
